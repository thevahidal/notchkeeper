name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Apple silicon runner: every Mac with a notch is arm64.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package
        run: |
          cd .build
          ditto -c -k --keepParent Notchkeeper.app Notchkeeper.zip
          # The disk image opens to Notchkeeper next to an Applications shortcut, for drag-to-install.
          mkdir dmg && cp -R Notchkeeper.app dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Notchkeeper -srcfolder dmg -ov -format UDZO Notchkeeper.dmg
          shasum -a 256 Notchkeeper.zip Notchkeeper.dmg | tee checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/Notchkeeper.zip .build/Notchkeeper.dmg .build/checksums.txt --title "Notchkeeper $GITHUB_REF_NAME" --generate-notes
